# Server
server.port=8080

# Active Profile (TEMPORARY: use 'dev' for local development)
spring.profiles.active=dev

# PostgreSQL Datasource
spring.datasource.url=jdbc:postgresql://127.0.0.1:5433/juice_platform
spring.datasource.username=juice_user
spring.datasource.password=juice_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Jackson
spring.jackson.time-zone=Asia/Kolkata

# SpringDoc OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.access-token-expiry-minutes=15
jwt.refresh-token-expiry-days=30

# Google OAuth
google.client-id=${GOOGLE_CLIENT_ID}

# Scheduler
scheduler.order-generation.cron=0 5 22 * * *
scheduler.subscription-activation.cron=0 4 22 * * *
scheduler.order-freeze.cron=0 0 22 * * *
scheduler.delivery-sheet.cron=0 10 22 * * *
