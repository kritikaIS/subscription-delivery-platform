# Test profile — overrides main application.properties
# Datasource is overridden by Testcontainers @DynamicPropertySource in each test class

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT — fixed test secret
jwt.secret=test-secret-key-that-is-at-least-32-chars-long
jwt.access-token-expiry-minutes=15
jwt.refresh-token-expiry-days=30

# Google OAuth — dummy value for tests (not called in service tests)
google.client-id=test-google-client-id

# Scheduler — disabled in tests
scheduler.order-generation.cron=-
scheduler.subscription-activation.cron=-
scheduler.order-freeze.cron=-
